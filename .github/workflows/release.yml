name: 手动公开发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: 已创建 Tag 对应的版本号，例如 2.0.0
        type: string
        default: 
        required: true
      confirmation:
        description: 输入 publish FocusMinecraftCore 加空格和版本号，确认公开发布
        type: string
        required: true
        default: publish FocusMinecraftCore

permissions:
  contents: read

env:
  PACKAGE_ID: FocusMinecraftCore

concurrency:
  group: fmcore-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/v2.0'
    runs-on: windows-latest
    steps:
      - name: 验证明确确认
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$') { throw 'Invalid version.' }
          if ($env:CONFIRMATION -cne "publish $env:PACKAGE_ID $env:VERSION") { throw 'Explicit publication confirmation is required.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: 校验 Tag、实际包版本及发布冲突
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $propertyJson = & dotnet msbuild FMCore/FMCore.csproj '-getProperty:Version,PackageVersion,PackageId' -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Package property evaluation failed.' }
          $properties = (($propertyJson -join "`n") | ConvertFrom-Json).Properties
          if ($properties.Version -cne $env:VERSION -or $properties.PackageVersion -cne $env:VERSION) { throw 'Tag/package version mismatch.' }
          if ($properties.PackageId -cne $env:PACKAGE_ID) { throw 'Package ID mismatch.' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read source commit.' }
          $tagCommit = git rev-parse "v$env:VERSION^{commit}"
          if ($LASTEXITCODE -ne 0 -or $headCommit -cne $tagCommit) { throw 'Tag commit mismatch.' }
          git merge-base --is-ancestor HEAD origin/v2.0
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is outside v2.0 history.' }
          if (!(Test-Path -LiteralPath CHANGELOG.md -PathType Leaf)) { throw 'Missing CHANGELOG.md.' }
          $versionPattern = [regex]::Escape($env:VERSION)
          $sectionPattern = "(?ms)^##[ \t]+v?$versionPattern(?=[ \t（(·]|\r?$)[^\r\n]*\r?\n(?<body>.*?)(?=^##[ \t]+|\z)"
          $section = [regex]::Match((Get-Content -LiteralPath CHANGELOG.md -Raw), $sectionPattern)
          if (!$section.Success -or [string]::IsNullOrWhiteSpace($section.Groups['body'].Value)) {
            throw "CHANGELOG.md must contain a non-empty '## $env:VERSION' section."
          }
          $currentChanges = "# $env:PACKAGE_ID $env:VERSION`n`n" + $section.Groups['body'].Value.Trim() + "`n"
          $currentChanges | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'fmcore-changelog-current.md') -Encoding utf8NoBOM
          $release = Invoke-WebRequest "https://api.github.com/repos/$env:REPOSITORY/releases/tags/v$env:VERSION" -Headers @{Authorization="Bearer $env:GH_TOKEN"} -SkipHttpErrorCheck -TimeoutSec 30
          if ($release.StatusCode -notin 200, 404) { throw "Release check failed (HTTP $($release.StatusCode))." }
          $id = $env:PACKAGE_ID.ToLowerInvariant()
          $version = $env:VERSION.ToLowerInvariant()
          $package = Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg" -Method Head -SkipHttpErrorCheck -TimeoutSec 30
          if ($package.StatusCode -ne 404) { throw "NuGet version exists or check failed (HTTP $($package.StatusCode))." }
      - run: dotnet restore FMCore.slnx
      - run: dotnet build FMCore.slnx -c Release --no-restore
      - run: dotnet pack FMCore/FMCore.csproj -c Release --no-build --no-restore -o artifacts/packages
      - name: 生成本版变更与产物校验清单
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'fmcore-changelog-current.md') -Destination artifacts/packages/CHANGELOG.md
          git rev-parse HEAD | Set-Content artifacts/packages/SOURCE_COMMIT.txt -Encoding utf8NoBOM
          $files = @("$env:PACKAGE_ID.$env:VERSION.nupkg", "$env:PACKAGE_ID.$env:VERSION.snupkg", 'CHANGELOG.md', 'SOURCE_COMMIT.txt')
          $lines = foreach ($name in $files) { $hash = (Get-FileHash -LiteralPath "artifacts/packages/$name" -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $name" }
          $lines | Set-Content artifacts/packages/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FocusMinecraftCore-release-packages
          path: artifacts/packages/*
          if-no-files-found: error

  github-release:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FocusMinecraftCore-release-packages
          path: artifacts/packages
      - name: 校验产物并创建或复用 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          foreach ($line in Get-Content artifacts/packages/SHA256SUMS.txt) {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2 -or (Get-FileHash -LiteralPath "artifacts/packages/$($parts[1])" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $parts[0]) { throw 'Artifact hash mismatch.' }
          }
          $assets = @("artifacts/packages/$env:PACKAGE_ID.$env:VERSION.nupkg", "artifacts/packages/$env:PACKAGE_ID.$env:VERSION.snupkg",
            'artifacts/packages/CHANGELOG.md', 'artifacts/packages/SOURCE_COMMIT.txt', 'artifacts/packages/SHA256SUMS.txt')
          $release = Invoke-WebRequest "https://api.github.com/repos/$env:REPOSITORY/releases/tags/v$env:VERSION" -Headers @{Authorization="Bearer $env:GH_TOKEN"} -SkipHttpErrorCheck -TimeoutSec 30
          if ($release.StatusCode -eq 200) {
            & gh release edit "v$env:VERSION" --repo $env:REPOSITORY --notes-file artifacts/packages/CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw 'Cannot update the Release body from CHANGELOG.md.' }
            # 正文统一读取 CHANGELOG；不覆盖已有同名附件。
            $releaseArgs = @('release', 'upload', "v$env:VERSION", '--repo', $env:REPOSITORY) + $assets
          } elseif ($release.StatusCode -eq 404) {
            $releaseArgs = @('release', 'create', "v$env:VERSION", '--verify-tag', '--repo', $env:REPOSITORY,
              '--title', "FocusMinecraftCore v$env:VERSION", '--notes-file', 'artifacts/packages/CHANGELOG.md') + $assets
            if ($env:VERSION.Contains('-')) { $releaseArgs += '--prerelease' } else { $releaseArgs += '--latest' }
          } else {
            throw "Release check failed (HTTP $($release.StatusCode))."
          }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release upload/create failed. NuGet has not run; inspect state before resuming.' }

  nuget:
    needs: github-release
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FocusMinecraftCore-release-packages
          path: artifacts/packages
      - name: 校验产物并拒绝重复版本
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          foreach ($line in Get-Content artifacts/packages/SHA256SUMS.txt) {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2 -or (Get-FileHash -LiteralPath "artifacts/packages/$($parts[1])" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $parts[0]) { throw 'Artifact hash mismatch.' }
          }
          $id = $env:PACKAGE_ID.ToLowerInvariant()
          $version = $env:VERSION.ToLowerInvariant()
          $response = Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg" -Method Head -SkipHttpErrorCheck -TimeoutSec 30
          if ($response.StatusCode -ne 404) { throw "Version exists or check failed (HTTP $($response.StatusCode)); do not upload again." }
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: Voltucit
      - name: 使用 OIDC 短期凭据上传同一批包和符号
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/$env:PACKAGE_ID.$env:VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet upload failed or state is uncertain; stop and inspect, do not blindly retry.' }
