name: 手动公开发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: 输入并并创建 Tag 的版本号
        required: true
      confirmation:
        description: 输入 publish FocusMinecraftCore 加空格和版本号，确认公开发布
        required: true

permissions:
  contents: read

env:
  PACKAGE_ID: FocusMinecraftCore

concurrency:
  group: fmcore-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: 验证明确确认
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$') { throw 'Invalid version.' }
          if ($env:CONFIRMATION -cne "publish $env:PACKAGE_ID $env:VERSION") { throw 'Explicit publication confirmation is required.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - name: 校验 Tag、版本及发布冲突
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $project = [xml](Get-Content FMCore/FMCore.csproj -Raw)
          $properties = $project.Project.PropertyGroup
          if ($properties.Version -cne $env:VERSION -or $properties.PackageVersion -cne $env:VERSION) { throw 'Tag/package version mismatch.' }
          if ($properties.PackageId -cne $env:PACKAGE_ID) { throw 'Package ID mismatch.' }
          $headCommit = git rev-parse HEAD
          $tagCommit = git rev-parse "v$env:VERSION^{commit}"
          if ($LASTEXITCODE -ne 0 -or $headCommit -cne $tagCommit) { throw 'Tag commit mismatch.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is outside main history.' }
          $notes = "docs/releases/v$env:VERSION.md"
          if (!(Test-Path -LiteralPath $notes)) { throw 'Missing reviewed Chinese release notes.' }
          $release = Invoke-WebRequest "https://api.github.com/repos/$env:REPOSITORY/releases/tags/v$env:VERSION" -Headers @{Authorization="Bearer $env:GH_TOKEN"} -SkipHttpErrorCheck -TimeoutSec 30
          if ($release.StatusCode -ne 404) { throw "Release exists or check failed (HTTP $($release.StatusCode))." }
          $id = $env:PACKAGE_ID.ToLowerInvariant()
          $version = $env:VERSION.ToLowerInvariant()
          $package = Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg" -Method Head -SkipHttpErrorCheck -TimeoutSec 30
          if ($package.StatusCode -ne 404) { throw "NuGet version exists or check failed (HTTP $($package.StatusCode))." }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore FMCore.slnx
      - run: dotnet build FMCore.slnx -c Release --no-restore
      - run: dotnet pack FMCore/FMCore.csproj -c Release --no-build --no-restore -o artifacts/packages
      - name: 生成同源提交与产物校验清单
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          Copy-Item -LiteralPath CHANGELOG.md -Destination artifacts/packages/CHANGELOG.md
          Copy-Item -LiteralPath "docs/releases/v$env:VERSION.md" -Destination artifacts/packages/RELEASE_NOTES.md
          git rev-parse HEAD | Set-Content artifacts/packages/SOURCE_COMMIT.txt -Encoding utf8NoBOM
          $files = @("$env:PACKAGE_ID.$env:VERSION.nupkg", "$env:PACKAGE_ID.$env:VERSION.snupkg", 'CHANGELOG.md', 'RELEASE_NOTES.md', 'SOURCE_COMMIT.txt')
          $lines = foreach ($name in $files) { $hash = (Get-FileHash -LiteralPath "artifacts/packages/$name" -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $name" }
          $lines | Set-Content artifacts/packages/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FocusMinecraftCore-release-packages
          path: artifacts/packages/*
          if-no-files-found: error

  github-release:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FocusMinecraftCore-release-packages
          path: artifacts/packages
      - name: 校验同一批产物并创建正式 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          foreach ($line in Get-Content artifacts/packages/SHA256SUMS.txt) {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2 -or (Get-FileHash -LiteralPath "artifacts/packages/$($parts[1])" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $parts[0]) { throw 'Artifact hash mismatch.' }
          }
          $releaseArgs = @('release', 'create', "v$env:VERSION", '--verify-tag', '--repo', $env:REPOSITORY,
            '--title', "FocusMinecraftCore v$env:VERSION", '--notes-file', 'artifacts/packages/RELEASE_NOTES.md',
            "artifacts/packages/$env:PACKAGE_ID.$env:VERSION.nupkg", "artifacts/packages/$env:PACKAGE_ID.$env:VERSION.snupkg",
            'artifacts/packages/CHANGELOG.md', 'artifacts/packages/RELEASE_NOTES.md', 'artifacts/packages/SOURCE_COMMIT.txt', 'artifacts/packages/SHA256SUMS.txt')
          if ($env:VERSION.Contains('-')) { $releaseArgs += '--prerelease' } else { $releaseArgs += '--latest' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release failed. NuGet has not run; inspect state before resuming.' }

  nuget:
    needs: github-release
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.402
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FocusMinecraftCore-release-packages
          path: artifacts/packages
      - name: 校验产物并拒绝重复版本
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          foreach ($line in Get-Content artifacts/packages/SHA256SUMS.txt) {
            $parts = $line -split '  ', 2
            if ($parts.Count -ne 2 -or (Get-FileHash -LiteralPath "artifacts/packages/$($parts[1])" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $parts[0]) { throw 'Artifact hash mismatch.' }
          }
          $id = $env:PACKAGE_ID.ToLowerInvariant()
          $version = $env:VERSION.ToLowerInvariant()
          $response = Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg" -Method Head -SkipHttpErrorCheck -TimeoutSec 30
          if ($response.StatusCode -ne 404) { throw "Version exists or check failed (HTTP $($response.StatusCode)); do not upload again." }
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: Voltucit
      - name: 使用 OIDC 短期凭据上传同一批包和符号
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/$env:PACKAGE_ID.$env:VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet upload failed or state is uncertain; stop and inspect, do not blindly retry.' }
